name: Vulkan loader path

# No-GPU loader-path qualification for VK_EXT_map_memory_placed.  Independent
# from pr-ci.yml: this lane needs no Android SDK/NDK/Gradle stack, no GPU and no
# display server.
#
#   Lane A (lavapipe): a real software Vulkan ICD selected through
#     VK_ICD_FILENAMES.  It does not implement VK_EXT_map_memory_placed, so the
#     loader-mediated harness must report RESULT=SKIP (exit 77) and validation
#     must stay clean.
#   Lane B (Vulkan-Tools Mock ICD + capability patch): the mock ICD advertises
#     VK_EXT_map_memory_placed but its generated GetPhysicalDeviceFeatures2KHR
#     leaves the placed-memory feature bits false.  The documented patch
#     tools/tests/mock-icd/VkICD_map_memory_placed.patch sets
#     memoryMapPlaced/memoryMapRangePlaced true, so the harness creates a device
#     with the extension (+ its VK_KHR_map_memory2 dependency) enabled, maps
#     placed and range-placed memory through vkMapMemory2 and tears it down.
#     The Vulkan-Profiles capability file
#     (tools/tests/mock-icd/VP_VAPOR_map_memory_placed.json) models the same
#     capability for the intended mock-ICD + profiles-layer route; that route is
#     documented in the receipt but not used here because the profiles layer
#     needs a sizeable Vulkan-Utility-Libraries/valijson/jsoncpp bootstrap.
#
# Host Vulkan headers/loader/validation layer come from the pinned LunarG
# Ubuntu repository (1.4.313, which knows VK_EXT_map_memory_placed); Ubuntu
# 24.04's archive packages are 1.3.275 and predate the extension, so the
# validation layer would otherwise reject the feature/capability structs.
# The mock ICD is built from the pinned Vulkan-Tools tag and patched.
#
# No real RADV/ANV/NVK/Turnip semantics are tested: the mock ICD ignores the
# placement address and lavapipe does not implement the extension.  These lanes
# qualify loader/entry-point plumbing, capability reporting, validation
# cleanliness and the capability-skip logic only.

on:
  pull_request:
  push:
    branches: [Vapor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-loader-path-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_TOOLS_TAG: vulkan-sdk-1.4.313.0
  VULKAN_TOOLS_SHA: ad2f0170f9466fadd96e3fdd65fad02cd3a3739b
  LUNARG_VULKAN_VERSION: "1.4.313"
  LUNARG_REPO_LIST_URL: https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-noble.list
  LUNARG_KEY_URL: https://packages.lunarg.com/lunarg-signing-key-pub.asc
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  loader-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install host packages and pinned LunarG Vulkan runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git wget pkg-config python3 python3-pip
          # python3-jsonschema is used by the driver's --validate-profile mode; fall
          # back to PyPI if the distribution package is unavailable.
          sudo apt-get install -y --no-install-recommends python3-jsonschema || \
            python3 -m pip install --quiet --user --break-system-packages jsonschema
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"
          wget -qO /tmp/lunarg-signing-key-pub.asc "$LUNARG_KEY_URL"
          sudo install -m 0644 /tmp/lunarg-signing-key-pub.asc \
            /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "$LUNARG_REPO_LIST_URL"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            vulkan-headers libvulkan-dev libvulkan1 vulkan-validationlayers \
            mesa-vulkan-drivers
          dpkg-query -W -f='${Package} ${Version}\n' \
            vulkan-headers libvulkan-dev libvulkan1 vulkan-validationlayers \
            mesa-vulkan-drivers || true
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Build patched Vulkan-Tools mock ICD
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          git clone --quiet --depth 1 --branch "$VULKAN_TOOLS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Tools "$BUILD_DIR/Vulkan-Tools"
          actual="$(git -C "$BUILD_DIR/Vulkan-Tools" rev-parse HEAD)"
          if [ "$actual" != "$VULKAN_TOOLS_SHA" ]; then
            echo "ERROR: Vulkan-Tools is at $actual, expected $VULKAN_TOOLS_SHA" >&2
            exit 1
          fi
          git -C "$BUILD_DIR/Vulkan-Tools" apply \
            "$GITHUB_WORKSPACE/tools/tests/mock-icd/VkICD_map_memory_placed.patch"
          cmake -S "$BUILD_DIR/Vulkan-Tools" -B "$BUILD_DIR/vulkan-tools" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CUBE=OFF -DBUILD_VULKANINFO=OFF \
            -DBUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$BUILD_DIR/vulkan-tools" \
            --target VkICD_mock_icd -j"$(nproc)"
          test -f "$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"
          cat "$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"

      - name: Build loader-path harness
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            tools/tests/vulkan-loader-path.c -lvulkan \
            -o "$BUILD_DIR/vulkan-loader-path"
          "$BUILD_DIR/vulkan-loader-path" --help

      - name: Validate Vulkan Profiles capability file
        run: |
          set -euo pipefail
          python3 tools/tests/vulkan-loader-path.py --validate-profile \
            tools/tests/mock-icd/VP_VAPOR_map_memory_placed.json

      - name: Self-test lane assertions
        run: python3 tools/tests/vulkan-loader-path.py --self-test

      - name: Lane A - lavapipe must SKIP placed memory with clean validation
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/logs" "$BUILD_DIR/lavapipe"
          VULKAN_ICD_SYSTEM_DIRS="/usr/share/vulkan /etc/vulkan"
          VULKAN_LIB_DIRS="/usr/lib /usr/lib64 /usr/local/lib"

          echo "=== lavapipe ICD discovery ==="
          MESA_DPKG_FILES="$(dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -Ei 'vulkan|icd' || true)"
          echo "--- dpkg -L mesa-vulkan-drivers | grep -Ei 'vulkan|icd' ---"
          printf '%s\n' "$MESA_DPKG_FILES" || true
          echo "--- ls -la /usr/share/vulkan/icd.d ---"
          ls -la /usr/share/vulkan/icd.d/ || true
          echo "--- ls -la /usr/share/vulkan/explicit_layer.d ---"
          ls -la /usr/share/vulkan/explicit_layer.d/ || true
          echo "--- find $VULKAN_ICD_SYSTEM_DIRS $VULKAN_LIB_DIRS -iname '*lvp*' ---"
          find $VULKAN_ICD_SYSTEM_DIRS $VULKAN_LIB_DIRS -iname '*lvp*' 2>/dev/null | sort || true

          # Mesa has shipped the lavapipe ICD manifest as lvp_icd.x86_64.json,
          # lvp_icd.json and (in some builds) only libvulkan_lvp.so.  Resolve the
          # manifest defensively and, if only the library is present, synthesize a
          # minimal manifest with an absolute library_path in $BUILD_DIR.  Manifests
          # with a relative library_path are copied to $BUILD_DIR with an absolute
          # path so the lane never depends on loader-relative-path resolution.
          echo "--- dpkg-listed lavapipe files (existing only) ---"
          MESA_DPKG_JSON_FILES="$(printf '%s\n' "$MESA_DPKG_FILES" | grep -E '\.json$' | while IFS= read -r path; do [ -e "$path" ] && printf '%s\n' "$path"; done || true)"
          MESA_DPKG_LVP_LIB="$(printf '%s\n' "$MESA_DPKG_FILES" | grep -E 'libvulkan_lvp' | while IFS= read -r path; do [ -e "$path" ] && printf '%s\n' "$path"; done | head -n 1 || true)"
          printf '%s\n' "$MESA_DPKG_JSON_FILES" || true
          printf '%s\n' "$MESA_DPKG_LVP_LIB" || true

          ICD_JSON_CANDIDATES="$({ find $VULKAN_ICD_SYSTEM_DIRS -maxdepth 3 -type f -name '*.json' 2>/dev/null || true; printf '%s\n' "$MESA_DPKG_JSON_FILES" || true; } | grep -E '\.json$' | sort -u || true)"
          LVP_LIB="$(find $VULKAN_LIB_DIRS -iname 'libvulkan_lvp*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$LVP_LIB" ] && [ -n "$MESA_DPKG_LVP_LIB" ]; then
            LVP_LIB="$MESA_DPKG_LVP_LIB"
          fi
          echo "ICD_JSON_CANDIDATES=$ICD_JSON_CANDIDATES"
          echo "LVP_LIB=$LVP_LIB"
          export BUILD_DIR ICD_JSON_CANDIDATES LVP_LIB

          RESOLVED_ICD="$(python3 - <<'PYRESOLVE'
          import json
          import os
          import pathlib
          import sys

          build_dir = pathlib.Path(os.environ["BUILD_DIR"])
          out_dir = build_dir / "lavapipe"
          out_dir.mkdir(parents=True, exist_ok=True)
          lib = os.environ.get("LVP_LIB", "").strip()
          candidates = [line.strip() for line in
                        os.environ.get("ICD_JSON_CANDIDATES", "").splitlines()
                        if line.strip()]

          def basename_mentions_lvp(path):
              name = pathlib.Path(path).name.lower()
              return "lvp" in name or "lavapipe" in name

          def manifest_details(path):
              """Return (ok, library_path, resolved_library) or (False, reason, None)."""
              try:
                  data = json.loads(pathlib.Path(path).read_text())
              except (OSError, ValueError) as error:
                  return False, "unreadable manifest: %s" % error, None
              icd = data.get("ICD") or {}
              library_path = icd.get("library_path")
              if not library_path:
                  return False, "manifest has no ICD.library_path", None
              resolved = pathlib.Path(library_path)
              if not resolved.is_absolute():
                  resolved = (pathlib.Path(path).parent / resolved).resolve()
              if resolved.is_file():
                  return True, library_path, resolved
              return False, "library_path does not resolve: %s" % resolved, None

          def normalise_manifest(path):
              """Copy a manifest with a relative library_path to $BUILD_DIR with an
              absolute path; return the path to hand to VK_ICD_FILENAMES."""
              data = json.loads(pathlib.Path(path).read_text())
              library = pathlib.Path(data["ICD"]["library_path"])
              if library.is_absolute():
                  return path, False
              data["ICD"]["library_path"] = str((pathlib.Path(path).parent / library).resolve())
              target = out_dir / (pathlib.Path(path).stem + "_absolute.json")
              target.write_text(json.dumps(data, indent=4) + "\n")
              return str(target), True

          preferred = [candidate for candidate in candidates if basename_mentions_lvp(candidate)]
          others = [candidate for candidate in candidates if candidate not in preferred]

          def accept(candidate, source):
              ok, detail, resolved = manifest_details(candidate)
              if not ok:
                  print("LAVAPIPE_ICD_SKIP=%s (%s)" % (candidate, detail), file=sys.stderr)
                  return False
              manifest, normalised = normalise_manifest(candidate)
              print("LAVAPIPE_ICD_SOURCE=%s%s" % (source,
                    "-normalized" if normalised else ""), file=sys.stderr)
              print("LAVAPIPE_ICD_LIBRARY=%s" % detail, file=sys.stderr)
              if normalised:
                  print("LAVAPIPE_ICD_ORIGINAL=%s" % candidate, file=sys.stderr)
              print(manifest)
              sys.exit(0)

          # Preferred manifests (lvp/lavapipe in the file name) must resolve.
          for candidate in preferred:
              accept(candidate, "manifest")

          # A differently named manifest is accepted only when its library path
          # clearly points at lavapipe, so this lane can never silently run on a
          # different ICD.
          for candidate in others:
              ok, detail, resolved = manifest_details(candidate)
              library_name = pathlib.Path(detail).name.lower() if detail else ""
              if ok and ("lvp" in library_name or "lavapipe" in library_name):
                  accept(candidate, "manifest-content")

          if lib:
              target = out_dir / "lvp_icd.json"
              target.write_text(json.dumps({
                  "file_format_version": "1.0.0",
                  "ICD": {"library_path": str(pathlib.Path(lib).resolve()), "api_version": "1.3.0"},
              }, indent=4) + "\n")
              print("LAVAPIPE_ICD_SOURCE=synthesized-from-library", file=sys.stderr)
              print("LAVAPIPE_ICD_LIBRARY=%s" % pathlib.Path(lib).resolve(), file=sys.stderr)
              print(target)
              sys.exit(0)

          print("ERROR: no lavapipe ICD manifest and no libvulkan_lvp library found", file=sys.stderr)
          print("candidates checked: %s" % (candidates or "none"), file=sys.stderr)
          sys.exit(1)
          PYRESOLVE
          )"
          test -n "$RESOLVED_ICD"
          test -f "$RESOLVED_ICD"
          echo "resolved lavapipe ICD: $RESOLVED_ICD"
          echo "resolved lavapipe manifest:"; cat "$RESOLVED_ICD"

          python3 tools/tests/vulkan-loader-path.py \
            --lane lavapipe --expect skip --validation \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$RESOLVED_ICD" \
            --log-dir "$BUILD_DIR/logs" --print-all
          echo "--- second pass with --print-all for the log ---"
          python3 tools/tests/vulkan-loader-path.py \
            --lane lavapipe-print-all --expect skip --validation --print-all \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$RESOLVED_ICD" \
            --log-dir "$BUILD_DIR/logs"

      - name: Lane B - patched mock ICD must SUPPORT placed memory with clean validation
        run: |
          set -euo pipefail
          MOCK_ICD="$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"
          test -f "$MOCK_ICD"
          # Resolve the build-tree manifest's relative library_path to an absolute
          # path so the lane does not depend on loader-relative-path resolution.
          MOCK_ICD="$(python3 - "$MOCK_ICD" <<'PYABS'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          library = pathlib.Path(data["ICD"]["library_path"])
          if not library.is_absolute():
              library = (path.parent / library).resolve()
              data["ICD"]["library_path"] = str(library)
              path.write_text(json.dumps(data, indent=4) + "\n")
          print(data["ICD"]["library_path"])
          print(path)
          PYABS
          )"
          MOCK_ICD="$(printf '%s\n' "$MOCK_ICD" | tail -n 1)"
          echo "resolved mock ICD manifest: $MOCK_ICD"
          python3 - "$MOCK_ICD" <<'PYSHOW'
          import json
          import pathlib
          import sys

          print("mock ICD manifest:", json.dumps(json.loads(pathlib.Path(sys.argv[1]).read_text())))
          PYSHOW
          python3 tools/tests/vulkan-loader-path.py \
            --lane mock-icd --expect supported --validation \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$MOCK_ICD" \
            --log-dir "$BUILD_DIR/logs"

      - name: Upload loader-path logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-loader-path-logs
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
