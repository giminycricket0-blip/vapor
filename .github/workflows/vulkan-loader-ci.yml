name: Vulkan loader path

# No-GPU loader-path qualification for VK_EXT_map_memory_placed.  Independent
# from pr-ci.yml: this lane needs no Android SDK/NDK/Gradle stack, no GPU and no
# display server.
#
#   Lane A (lavapipe): a real software Vulkan ICD selected through
#     VK_ICD_FILENAMES.  It does not implement VK_EXT_map_memory_placed, so the
#     loader-mediated harness must report RESULT=SKIP (exit 77) and validation
#     must stay clean.
#   Lane B (Vulkan-Tools Mock ICD + capability patch): the mock ICD advertises
#     VK_EXT_map_memory_placed but its generated GetPhysicalDeviceFeatures2KHR
#     leaves the placed-memory feature bits false.  The documented patch
#     tools/tests/mock-icd/VkICD_map_memory_placed.patch sets
#     memoryMapPlaced/memoryMapRangePlaced true, so the harness creates a device
#     with the extension (+ its VK_KHR_map_memory2 dependency) enabled, maps
#     placed and range-placed memory through vkMapMemory2 and tears it down.
#     The Vulkan-Profiles capability file
#     (tools/tests/mock-icd/VP_VAPOR_map_memory_placed.json) models the same
#     capability for the intended mock-ICD + profiles-layer route; that route is
#     documented in the receipt but not used here because the profiles layer
#     needs a sizeable Vulkan-Utility-Libraries/valijson/jsoncpp bootstrap.
#
# Host Vulkan headers/loader/validation layer come from the pinned LunarG
# Ubuntu repository (1.4.313, which knows VK_EXT_map_memory_placed); Ubuntu
# 24.04's archive packages are 1.3.275 and predate the extension, so the
# validation layer would otherwise reject the feature/capability structs.
# The mock ICD is built from the pinned Vulkan-Tools tag and patched.
#
# No real RADV/ANV/NVK/Turnip semantics are tested: the mock ICD ignores the
# placement address and lavapipe does not implement the extension.  These lanes
# qualify loader/entry-point plumbing, capability reporting, validation
# cleanliness and the capability-skip logic only.

on:
  pull_request:
  push:
    branches: [Vapor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-loader-path-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_TOOLS_TAG: vulkan-sdk-1.4.313.0
  VULKAN_TOOLS_SHA: ad2f0170f9466fadd96e3fdd65fad02cd3a3739b
  LUNARG_VULKAN_VERSION: "1.4.313"
  LUNARG_REPO_LIST_URL: https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-noble.list
  LUNARG_KEY_URL: https://packages.lunarg.com/lunarg-signing-key-pub.asc
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  loader-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install host packages and pinned LunarG Vulkan runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git wget pkg-config python3 python3-pip
          # python3-jsonschema is used by the driver's --validate-profile mode; fall
          # back to PyPI if the distribution package is unavailable.
          sudo apt-get install -y --no-install-recommends python3-jsonschema || \
            python3 -m pip install --quiet --user --break-system-packages jsonschema
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"
          wget -qO /tmp/lunarg-signing-key-pub.asc "$LUNARG_KEY_URL"
          sudo install -m 0644 /tmp/lunarg-signing-key-pub.asc \
            /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "$LUNARG_REPO_LIST_URL"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            vulkan-headers libvulkan-dev libvulkan1 vulkan-validationlayers \
            mesa-vulkan-drivers
          dpkg-query -W -f='${Package} ${Version}\n' \
            vulkan-headers libvulkan-dev libvulkan1 vulkan-validationlayers \
            mesa-vulkan-drivers || true
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Build patched Vulkan-Tools mock ICD
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          git clone --quiet --depth 1 --branch "$VULKAN_TOOLS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Tools "$BUILD_DIR/Vulkan-Tools"
          actual="$(git -C "$BUILD_DIR/Vulkan-Tools" rev-parse HEAD)"
          if [ "$actual" != "$VULKAN_TOOLS_SHA" ]; then
            echo "ERROR: Vulkan-Tools is at $actual, expected $VULKAN_TOOLS_SHA" >&2
            exit 1
          fi
          git -C "$BUILD_DIR/Vulkan-Tools" apply \
            "$GITHUB_WORKSPACE/tools/tests/mock-icd/VkICD_map_memory_placed.patch"
          cmake -S "$BUILD_DIR/Vulkan-Tools" -B "$BUILD_DIR/vulkan-tools" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CUBE=OFF -DBUILD_VULKANINFO=OFF \
            -DBUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$BUILD_DIR/vulkan-tools" \
            --target VkICD_mock_icd -j"$(nproc)"
          test -f "$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"
          cat "$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"

      - name: Build loader-path harness
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            tools/tests/vulkan-loader-path.c -lvulkan \
            -o "$BUILD_DIR/vulkan-loader-path"
          "$BUILD_DIR/vulkan-loader-path" --help

      - name: Validate Vulkan Profiles capability file
        run: |
          set -euo pipefail
          python3 tools/tests/vulkan-loader-path.py --validate-profile \
            tools/tests/mock-icd/VP_VAPOR_map_memory_placed.json

      - name: Self-test lane assertions
        run: python3 tools/tests/vulkan-loader-path.py --self-test

      - name: Lane A - lavapipe must SKIP placed memory with clean validation
        run: |
          set -euo pipefail
          LAVAPIPE_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd.*.json | head -n 1)"
          test -f "$LAVAPIPE_ICD"
          echo "lavapipe ICD: $LAVAPIPE_ICD"
          mkdir -p "$BUILD_DIR/logs"
          python3 tools/tests/vulkan-loader-path.py \
            --lane lavapipe --expect skip --validation \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$LAVAPIPE_ICD" \
            --log-dir "$BUILD_DIR/logs" --print-all
          echo "--- second pass with --print-all for the log ---"
          python3 tools/tests/vulkan-loader-path.py \
            --lane lavapipe-print-all --expect skip --validation --print-all \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$LAVAPIPE_ICD" \
            --log-dir "$BUILD_DIR/logs"

      - name: Lane B - patched mock ICD must SUPPORT placed memory with clean validation
        run: |
          set -euo pipefail
          MOCK_ICD="$BUILD_DIR/vulkan-tools/icd/VkICD_mock_icd.json"
          test -f "$MOCK_ICD"
          python3 tools/tests/vulkan-loader-path.py \
            --lane mock-icd --expect supported --validation \
            --harness "$BUILD_DIR/vulkan-loader-path" \
            --icd "$MOCK_ICD" \
            --log-dir "$BUILD_DIR/logs"

      - name: Upload loader-path logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-loader-path-logs
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
