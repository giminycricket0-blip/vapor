name: Vapor build

on:
  pull_request:
  push:
    branches: [Vapor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vapor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native toolchains
        run: |
          vapor_sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$vapor_sdkmanager"
          "$vapor_sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
          rustup show
          sudo apt-get update
          sudo apt-get install -y make perl g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix
      - name: Rebuild Steam hosts from source
        run: bash app/src/main/cpp/wn-steam-launcher/build.sh
      - name: Check cloud-conflict answers
        run: |
          c++ -std=c++17 -Wall -Wextra app/src/main/cpp/wn-steam-launcher/tests/cloud_conflict_answer_test.cpp -o "$RUNNER_TEMP/cloud-conflict-answer-test"
          "$RUNNER_TEMP/cloud-conflict-answer-test"
      - name: Check Steam social probe
        run: |
          c++ -std=c++17 -Wall -Wextra app/src/main/cpp/wn-steam-launcher/tests/steam_friends_probe_test.cpp -o "$RUNNER_TEMP/steam-friends-probe-test"
          "$RUNNER_TEMP/steam-friends-probe-test"
          c++ -std=c++17 -Wall -Wextra -Werror app/src/main/cpp/wn-steam-launcher/tests/steam_friends_receive_test.cpp -o "$RUNNER_TEMP/steam-friends-receive-test"
          "$RUNNER_TEMP/steam-friends-receive-test"
          c++ -std=c++17 -Wall -Wextra -Werror app/src/main/cpp/wn-steam-launcher/tests/steam_probe_mode_test.cpp -o "$RUNNER_TEMP/steam-probe-mode-test"
          "$RUNNER_TEMP/steam-probe-mode-test"
          x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -Wall -Wextra -Werror -static -mwindows tools/tests/steam-friends-receive-runtime.cpp -luser32 -o "$RUNNER_TEMP/steam-receiver-contracts-x86_64.exe"
          i686-w64-mingw32-g++-posix -std=c++17 -O2 -Wall -Wextra -Werror -static -mwindows tools/tests/steam-friends-receive-runtime.cpp -luser32 -o "$RUNNER_TEMP/steam-receiver-contracts-i686.exe"
      - name: Compile isolated Steam DLL integration fixtures
        run: |
          for vapor_arch in x86_64 i686; do
            "${vapor_arch}-w64-mingw32-g++-posix" -std=c++17 -O2 -Wall -Wextra -Werror -static -shared tools/tests/steam-social-fixture.cpp -o "$RUNNER_TEMP/steam-social-fixture-$vapor_arch.dll"
            "${vapor_arch}-w64-mingw32-g++-posix" -std=c++17 -O2 -Wall -Wextra -Werror -static -mwindows tools/tests/steam-social-probe-runtime.cpp -luser32 -o "$RUNNER_TEMP/steam-social-integration-$vapor_arch.exe"
            "${vapor_arch}-w64-mingw32-g++-posix" -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter -static -mwindows -Iapp/src/main/cpp/wn-steam-launcher tools/tests/steam-probe-parent-runtime.cpp app/src/main/cpp/wn-steam-launcher/clean_shutdown.cpp -ladvapi32 -lkernel32 -luser32 -o "$RUNNER_TEMP/steam-probe-parent-$vapor_arch.exe"
          done
      - name: Build and test
        run: >-
          ./gradlew :app:assembleStandardDebug :app:testStandardDebugUnitTest
          --tests '*SteamLaunchRequirementsTest'
          --tests '*WnLauncherStatusTailerTest'
          --tests '*PEHelperTest'
          --tests '*GameEngineHintsTest'
          --tests '*GameLaunchTimingTest'
          --tests '*SteamLaunchExeFamilyTest'
          --tests '*SteamCloudConflictDialogTest'
          --tests '*SteamInstallRecoveryTest'
          --tests '*SteamClientLibraryTest'
          --tests '*LibraryViewTest'
          --tests '*DeviceProfileTest'
          --tests '*LibraryStoreLinkTest'
          --tests '*VaporPreparationTest'
          --tests '*AutomaticGraphicsTest'
          --tests '*GraphicsDriverCatalogTest'
          --tests '*SteamCloseSyncTest'
          --tests '*SteamExitCloudTest'
          --tests '*SessionKeepAliveServiceTest'
          --tests '*GameDisplaySettingsTest'
          --tests '*GameSessionFailureTest'
          --tests '*SteamLoginStateTest'
          --tests '*SteamSocialLayoutTest'
          --tests '*GameSettingsLayoutTest'
          --tests '*GameSettingsNavTest'
          --tests '*SteamConversationTest'
          --tests '*SteamChatServiceTest'
          --tests '*ArtworkMemoryTest'
          --tests '*StoreArtworkCacheTest'
          --max-workers=4 --console=plain
      - name: Check APK native alignment
        run: |
          bash tools/check-apk-16kb.sh app/build/outputs/apk/standard/debug/standard.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/standard/debug/standard.apk
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vapor-test-reports
          path: app/build/reports/tests/
          retention-days: 7
      # APK publication stays disabled until runtime redistribution review and signing are complete.
